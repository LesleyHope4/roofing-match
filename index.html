<style>
    :root { --primary: #2563eb; --solar: #f59e0b; --dark: #1e293b; --light: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--light); color: var(--dark); line-height: 1.6; }

    .hero {
        background-image: linear-gradient(rgba(30, 41, 59, 0.8), rgba(30, 41, 59, 0.8)), 
                          url('https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?auto=format&fit=crop&w=1600&q=80');
        background-size: cover; background-position: center; padding: 80px 20px; color: white; text-align: center;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 15px; }
    
    .form-card {
        background: white; padding: 25px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        max-width: 450px; margin: -50px auto 40px auto; position: relative; z-index: 10;
    }

    h1 { font-size: 1.8rem; margin-bottom: 10px; }
    label { display: block; font-size: 0.75rem; font-weight: bold; margin-bottom: 5px; color: #64748b; text-align: left; }
    
    input, select { 
        width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 6px; 
        font-size: 16px; /* Prevents iPhone zoom on focus */
    }
    
    button {
        width: 100%; 
        min-height: 60px; /* Ensures the button is tall enough for the text */
        padding: 10px 20px; 
        background-color: var(--primary); 
        color: white;
        border: none; 
        border-radius: 6px; 
        font-size: 1.1rem; 
        font-weight: bold; 
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    button:hover { background-color: #1d4ed8; }

    footer { text-align: center; padding: 40px; background: #f1f5f9; color: #64748b; font-size: 0.85rem; }
</style>
